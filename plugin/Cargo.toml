[package]
name = "thread-generator"
version = "2.0.0"
edition = "2021"
description = "3D-printable threads with print tolerance, a SolidCraft plugin"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
